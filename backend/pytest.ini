[pytest]
testpaths = tests
asyncio_mode = auto
; one event loop for the whole session so the shared google-genai async client stays bound to it
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    live: calls the real Razorpay Test Mode API (requires RAZORPAY_KEY_ID/SECRET in root .env)
    gemini: calls the real Gemini API (requires GEMINI_API_KEY in root .env)
