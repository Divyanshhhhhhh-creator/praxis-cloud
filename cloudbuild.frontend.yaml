# Cloud Build: praxis-frontend image (Next.js standalone, NEXT_PUBLIC_* baked at build time)
steps:
  - name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_AGENT_TOKEN=${_AGENT_TOKEN}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: ""
  _API_URL: ""
  _AGENT_TOKEN: ""
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
